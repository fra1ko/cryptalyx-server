<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Вход в Cryptalyx</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: #1e293b;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            padding: 3rem 2rem;
            text-align: center;
            border: 1px solid #334155;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .telegram-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 2rem;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
            text-decoration: none;
        }

        .telegram-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            color: #64748b;
            margin: 1.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #334155;
        }

        .divider span {
            padding: 0 1rem;
            font-size: 0.9rem;
        }

        .license-section {
            text-align: left;
        }

        .license-label {
            display: block;
            color: #e2e8f0;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .license-input {
            width: 100%;
            padding: 1rem 1.5rem;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 2rem;
            font-size: 1rem;
            font-family: monospace;
            letter-spacing: 2px;
            color: #f1f5f9;
            margin-bottom: 1rem;
            transition: all 0.2s;
        }

        .license-input:focus {
            outline: none;
            border-color: #3b82f6;
            background: #1e293b;
        }

        .login-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 2rem;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }

        .login-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            color: #f87171;
            margin-top: 1rem;
            font-size: 0.9rem;
            display: none;
            background: #450a0a;
            padding: 0.75rem;
            border-radius: 1rem;
            border: 1px solid #991b1b;
        }

        .info-text {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .info-text a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #64748b;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #3b82f6;
        }

        .demo-key {
            margin-top: 2rem;
            padding: 1rem;
            background: #0f172a;
            border-radius: 1rem;
            border: 1px dashed #3b82f6;
        }

        .demo-key p {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .demo-key code {
            color: #4ade80;
            font-family: monospace;
            background: #1e293b;
            padding: 0.25rem 0.5rem;
            border-radius: 0.5rem;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
            }

            .logo {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <div class="logo">Cryptalyx</div>
        <div class="subtitle">Войдите в свой личный кабинет</div>

        <a href="https://t.me/cryptalyx_official_bot" target="_blank" class="telegram-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.06-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.04-.48-.82-.27-1.47-.42-1.42-.88.03-.24.35-.49.98-.74 3.84-1.67 6.4-2.78 7.68-3.32 3.66-1.54 4.42-1.81 4.92-1.82.11 0 .35.02.51.15.13.11.17.26.18.4-.01.11-.03.29-.07.47z"/>
            </svg>
            Войти через Telegram
        </a>

        <div class="divider">
            <span>или</span>
        </div>

        <div class="license-section">
            <label class="license-label">Введите лицензионный ключ</label>
            <input type="text" class="license-input" id="licenseKey" 
                   placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX" 
                   onkeypress="if(event.key==='Enter') loginWithKey()">
            <button class="login-btn" id="loginBtn" onclick="loginWithKey()">Войти</button>
            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="info-text">
            Нет ключа? <a href="https://t.me/cryptalyx_official_bot" target="_blank">Купить подписку в Telegram</a>
        </div>

        <a href="/" class="back-link">← Вернуться на главную</a>

        <div class="demo-key">
            <p>🔐 Для теста используйте ключ:</p>
            <code>TEST-1234-5678-9012-3456-7890</code>
        </div>
    </div>

    <script>
        // Проверяем авторизацию
        if (localStorage.getItem('token')) {
            window.location.href = '/dashboard.html';
        }

        async function loginWithKey() {
            const licenseKey = document.getElementById('licenseKey').value.trim();
            const errorEl = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');

            if (!licenseKey) {
                errorEl.textContent = 'Введите лицензионный ключ';
                errorEl.style.display = 'block';
                return;
            }

            // Показываем загрузку
            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ Вход...';
            errorEl.style.display = 'none';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ licenseKey })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Сохраняем токен и данные пользователя
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userId', data.user.id);
                    localStorage.setItem('licenseKey', data.user.licenseKey);
                    localStorage.setItem('plan', data.user.plan);
                    localStorage.setItem('email', data.user.email || '');
                    localStorage.setItem('login', data.user.login || '');
                    
                    // Перенаправляем в дашборд
                    window.location.href = '/dashboard.html';
                } else {
                    errorEl.textContent = data.error || 'Ошибка входа';
                    errorEl.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Войти';
                }
            } catch (error) {
                console.error('Ошибка:', error);
                errorEl.textContent = 'Ошибка подключения к серверу';
                errorEl.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Войти';
            }
        }

        // Для теста - если нет настоящего ключа
        window.testLogin = function() {
            document.getElementById('licenseKey').value = 'TEST-1234-5678-9012-3456-7890';
            loginWithKey();
        };

        window.loginWithKey = loginWithKey;
    </script>
</body>
</html>
