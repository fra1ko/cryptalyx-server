<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptalyx Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: #0f172a;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .gradient-card {
            background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
        }
    </style>
</head>
<body class="text-gray-200 p-6">
    <div class="max-w-7xl mx-auto">
        <!-- Шапка -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <i class="fas fa-crown text-3xl text-yellow-400"></i>
                <h1 class="text-3xl font-bold bg-gradient-to-r from-yellow-400 to-yellow-200 bg-clip-text text-transparent">
                    Cryptalyx Admin
                </h1>
            </div>
            <div class="flex gap-3">
                <span class="text-sm text-gray-400" id="updateTime"></span>
                <button onclick="logout()" class="text-gray-400 hover:text-white transition">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>

        <!-- Форма входа -->
        <div id="loginForm" class="gradient-card max-w-md mx-auto p-8 rounded-2xl shadow-2xl mt-20">
            <div class="text-center mb-6">
                <i class="fas fa-lock text-4xl text-yellow-400 mb-3"></i>
                <h2 class="text-2xl font-bold">Вход в админ-панель</h2>
            </div>
            <input type="password" id="adminPass" placeholder="Пароль" 
                class="w-full p-3 mb-4 bg-gray-800 rounded-lg border border-gray-700 focus:border-yellow-400 focus:outline-none">
            <div id="loginError" class="text-red-400 text-sm mb-3 hidden"></div>
            <button onclick="login()" 
                class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3 px-4 rounded-lg transition">
                <i class="fas fa-sign-in-alt mr-2"></i>Войти
            </button>
        </div>

        <!-- Дашборд -->
        <div id="dashboard" style="display: none;">
            <!-- Статистика -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
                <div class="stat-card gradient-card p-6 rounded-xl">
                    <div class="flex items-center justify-between mb-3">
                        <div class="text-sm text-gray-400">Всего пользователей</div>
                        <i class="fas fa-users text-blue-400 text-xl"></i>
                    </div>
                    <div class="text-4xl font-bold text-white" id="totalUsers">—</div>
                    <div class="text-xs text-gray-500 mt-2">за всё время</div>
                </div>
                <div class="stat-card gradient-card p-6 rounded-xl">
                    <div class="flex items-center justify-between mb-3">
                        <div class="text-sm text-gray-400">Активных подписок</div>
                        <i class="fas fa-check-circle text-green-400 text-xl"></i>
                    </div>
                    <div class="text-4xl font-bold text-white" id="activeSubs">—</div>
                    <div class="text-xs text-gray-500 mt-2">действуют сейчас</div>
                </div>
                <div class="stat-card gradient-card p-6 rounded-xl">
                    <div class="flex items-center justify-between mb-3">
                        <div class="text-sm text-gray-400">Premium</div>
                        <i class="fas fa-star text-yellow-400 text-xl"></i>
                    </div>
                    <div class="text-4xl font-bold text-white" id="premiumCount">—</div>
                    <div class="text-xs text-gray-500 mt-2">активных</div>
                </div>
                <div class="stat-card gradient-card p-6 rounded-xl">
                    <div class="flex items-center justify-between mb-3">
                        <div class="text-sm text-gray-400">Basic</div>
                        <i class="fas fa-rocket text-blue-400 text-xl"></i>
                    </div>
                    <div class="text-4xl font-bold text-white" id="basicCount">—</div>
                    <div class="text-xs text-gray-500 mt-2">активных</div>
                </div>
            </div>

            <!-- Таблица пользователей -->
            <div class="gradient-card rounded-xl overflow-hidden">
                <div class="p-5 border-b border-gray-700 flex items-center justify-between">
                    <h2 class="text-xl font-semibold flex items-center gap-2">
                        <i class="fas fa-users text-yellow-400"></i>
                        Пользователи
                    </h2>
                    <span class="text-sm bg-gray-800 px-3 py-1 rounded-full" id="userCount">0</span>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-gray-800/50 text-yellow-400">
                            <tr>
                                <th class="p-4 text-left">Telegram</th>
                                <th class="p-4 text-left">Email</th>
                                <th class="p-4 text-left">План</th>
                                <th class="p-4 text-left">Ключ</th>
                                <th class="p-4 text-left">Действует до</th>
                                <th class="p-4 text-center">Действия</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable" class="divide-y divide-gray-700">
                            <tr><td colspan="6" class="text-center p-8 text-gray-500">
                                <i class="fas fa-spinner fa-spin mr-2"></i>Загрузка...
                            </td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001/api/admin';
        let token = localStorage.getItem('adminToken');

        // Форматирование даты
        function formatDate(dateStr) {
            if (!dateStr) return '—';
            try {
                const d = new Date(dateStr);
                return d.toLocaleDateString('ru-RU');
            } catch {
                return '—';
            }
        }

        // Обновление времени
        function updateTimestamp() {
            const el = document.getElementById('updateTime');
            if (el) el.innerText = '🕐 ' + new Date().toLocaleTimeString('ru-RU');
        }
        setInterval(updateTimestamp, 1000);

        // Показать ошибку
        function showError(message) {
            const tbody = document.getElementById('usersTable');
            if (tbody) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-red-400">
                    <i class="fas fa-exclamation-triangle mr-2"></i>${message}
                </td></tr>`;
            }
        }

        // Вход
        async function login() {
            const pass = document.getElementById('adminPass').value;
            const errorDiv = document.getElementById('loginError');
            
            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: pass})
                });
                
                const data = await res.json();
                
                if (res.ok && data.token) {
                    localStorage.setItem('adminToken', data.token);
                    token = data.token;
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    errorDiv.classList.add('hidden');
                    loadData();
                    updateTimestamp();
                } else {
                    errorDiv.classList.remove('hidden');
                    errorDiv.innerText = data.error || 'Неверный пароль';
                }
            } catch (error) {
                errorDiv.classList.remove('hidden');
                errorDiv.innerText = 'Ошибка соединения с сервером';
            }
        }

        // Выход
        function logout() {
            localStorage.removeItem('adminToken');
            token = null;
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }

        // Загрузка данных
        async function loadData() {
            if (!token) {
                logout();
                return;
            }

            try {
                // Статистика
                const statsRes = await fetch(`${API_URL}/stats`, {
                    headers: {'Authorization': 'Bearer ' + token}
                });
                
                if (!statsRes.ok) {
                    if (statsRes.status === 401) {
                        logout();
                        return;
                    }
                    throw new Error(`HTTP ${statsRes.status}`);
                }
                
                const stats = await statsRes.json();
                
                document.getElementById('totalUsers').textContent = stats.totalUsers || 0;
                document.getElementById('activeSubs').textContent = stats.activeSubscriptions || 0;
                document.getElementById('premiumCount').textContent = stats.premiumCount || 0;
                document.getElementById('basicCount').textContent = stats.basicCount || 0;
                document.getElementById('userCount').textContent = stats.totalUsers || 0;

                // Пользователи
                const usersRes = await fetch(`${API_URL}/users`, {
                    headers: {'Authorization': 'Bearer ' + token}
                });
                
                if (!usersRes.ok) throw new Error(`HTTP ${usersRes.status}`);
                
                const users = await usersRes.json();
                
                const tbody = document.getElementById('usersTable');
                
                if (!users || users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center p-8 text-gray-500">👥 Нет пользователей</td></tr>';
                    return;
                }

                tbody.innerHTML = users.map(u => `
                    <tr class="hover:bg-gray-800/30 transition">
                        <td class="p-4">
                            <div class="flex items-center gap-2">
                                <i class="fab fa-telegram text-blue-400"></i>
                                <span>${u.login || u.telegram_id || '—'}</span>
                            </div>
                        </td>
                        <td class="p-4">${u.email || '—'}</td>
                        <td class="p-4">
                            ${u.plan === 'premium' 
                                ? '<span class="bg-yellow-500/20 text-yellow-400 px-2 py-1 rounded-full text-xs">PREMIUM</span>' 
                                : '<span class="bg-blue-500/20 text-blue-400 px-2 py-1 rounded-full text-xs">BASIC</span>'}
                        </td>
                        <td class="p-4 font-mono text-xs">${u.license_key || '—'}</td>
                        <td class="p-4">${formatDate(u.expire_date)}</td>
                        <td class="p-4 text-center">
                            <button onclick="extendSub('${u.id}')" class="text-yellow-400 hover:text-yellow-300 mx-2" title="Продлить">
                                <i class="fas fa-calendar-plus"></i>
                            </button>
                            <button onclick="deleteUser('${u.id}')" class="text-red-400 hover:text-red-300 mx-2" title="Удалить">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
                
            } catch (error) {
                showError('Ошибка загрузки данных: ' + error.message);
            }
        }

        // Проверяем при загрузке
        if (token) {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadData();
            updateTimestamp();
        }

        // Заглушки для функций
        function extendSub(userId) {
            alert('Функция продления в разработке');
        }

        function deleteUser(userId) {
            if (confirm('Удалить пользователя? Это действие необратимо.')) {
                alert('Удаление в разработке');
            }
        }
    </script>
</body>
</html>
